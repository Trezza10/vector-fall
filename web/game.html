<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vector Fall</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09151b;color:#b6e9df;font:18px system-ui;touch-action:none;overscroll-behavior:none}#canvas{display:block;width:100%;height:100%;outline:none}#cover{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#09151bf5;padding:24px;z-index:2}button{font:inherit;background:#153137;color:#91f0d4;border:1px solid #55b6ac;border-radius:6px;padding:16px 32px;cursor:pointer}p{max-width:32em;line-height:1.5}#version{position:fixed;right:8px;bottom:4px;font:10px monospace;color:#a1b6b3;pointer-events:none;opacity:.7}#full{position:fixed;left:50%;transform:translateX(-50%);top:8px;z-index:1;padding:8px;font-size:12px}progress{width:100%;accent-color:#58ddc2}#rotate{display:none}@media(orientation:portrait) and (pointer:coarse){#rotate{display:block;color:#ffca82}}
</style>$GODOT_HEAD_INCLUDE</head><body>
<canvas id="canvas" tabindex="0">Your browser needs WebGL 2 and WebAssembly.</canvas>
<button id="full" aria-label="Toggle fullscreen">Fullscreen</button>
<div id="version"></div><div id="cover"><main><h1>VECTOR FALL</h1><p>Keyboard / mouse, controller, or one-thumb touch steering.</p><p id="rotate">Portrait and landscape supported. Drag the pad to move and aim. Lift and quickly retouch to dash.</p><p><label><input id="touch" type="checkbox"> Use touch controls</label></p><button id="start">Play latest build</button><p id="status" role="status"></p><progress id="progress" hidden></progress></main></div>
<script src="$GODOT_URL"></script><script>
const gameConfig=$GODOT_CONFIG;const touch=document.getElementById("touch");touch.checked=navigator.maxTouchPoints>0;const start=document.getElementById('start');const status=document.getElementById('status');const progress=document.getElementById('progress');
document.getElementById('version').textContent=location.pathname.split('/').pop().replace('game-','').replace('.html','');
document.getElementById('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{});};
start.onclick=async()=>{start.disabled=true;status.textContent='Loading game…';progress.hidden=false;try{const missing=Engine.getMissingFeatures({threads:$GODOT_THREADS_ENABLED});if(missing.length)throw Error('This browser is missing: '+missing.join(', '));const config={...gameConfig};if(touch.checked)config.args=[...(config.args||[]),'--','--touch-controls'];const engine=new Engine(config);await engine.startGame({onProgress:(done,total)=>{if(total){progress.max=total;progress.value=done;}}});document.getElementById('cover').remove();document.getElementById('canvas').focus();}catch(e){status.textContent=e.message||String(e);start.disabled=false;start.textContent='Retry';}};
</script></body></html>
